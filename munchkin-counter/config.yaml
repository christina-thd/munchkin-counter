name: "Munchkin Counter"
description: "Level counter for the Munchkin card game: tablet dashboard, phones join by QR code"
version: "2.9.0"
slug: "munchkin_counter"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
# Host network so the QR code shows the host's real address (not the add-on's internal one).
# The web interface listens on port 3000 of the host.
host_network: true
ingress: true
ingress_port: 3000
# Read-only access to the "share" folder, for an optional custom logo, and to the "ssl" folder, for
# Home Assistant's own certificate on the secure address (see DOCS.md)
map:
  - share:ro
  - ssl:ro
panel_icon: "mdi:sword-cross"
panel_title: "Munchkin"
options:
  host_ip: ""
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  domain: ""
schema:
  host_ip: "str?"
  ssl: bool
  certfile: str
  keyfile: str
  domain: "str?"
