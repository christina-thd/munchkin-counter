<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Munchkin Counter</title>
  <script src="js/shared/device-check.js"></script>
  <link rel="icon" href="logo">
  <!-- PNG icons too: "Add to Home Screen" ignores SVG icons and would show a plain letter instead -->
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <meta name="theme-color" content="#1b120b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Munchkin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/lobby.css">
  <link rel="stylesheet" href="css/table.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Start page and dashboard share this page, so switching between them stays in full screen (js/app.js). -->

  <!-- ===== start page ===== -->
  <div class="view lobby-view" id="lobbyView" hidden>
    <button class="corner-button fullscreen-button" title="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="expand" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="collapse" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>

    <main class="lobby">
      <section class="hero">
        <img class="logo" src="logo" alt="">
        <h1>Munchkin</h1>
        <p class="tagline">Kick open the door. We'll keep count.</p>

        <div class="continue" id="continue" hidden>
          <div class="label">Continue</div>
          <div class="game-name" id="currentName"></div>
          <div class="players" id="currentPlayers"></div>
          <div class="meta" id="currentMeta"></div>
          <button class="big primary" id="continueButton">▶ Play</button>
        </div>

        <button class="big" id="newGame">+ New game</button>
      </section>

      <section class="history">
        <h2>Past games</h2>
        <div class="games" id="games"></div>
      </section>
    </main>
  </div>

  <!-- ===== dashboard ===== -->
  <div class="view table-view" id="tableView" hidden>
    <header class="topbar">
      <div class="brand"><img src="logo" alt="">Munchkin</div>
      <a class="game-button" id="gameButton" href="./" title="All games">🎲 <span id="gameName"></span></a>
      <div class="announcer" id="announcer" aria-live="polite"></div>
      <button class="bar-button primary" id="addPlayer">+ Player</button>
      <button class="bar-button icon" id="activity" title="Activity log" aria-label="Activity log">📜</button>
      <button class="bar-button icon" id="sound" title="Sound on/off">🔊</button>
      <button class="bar-button icon fullscreen-button" title="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="expand" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="collapse" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
      <img class="qr-thumb" id="qrButton" src="qr.svg" alt="Join QR code" title="Show join QR code">
    </header>

    <main id="board"></main>

    <div id="qrOverlay">
      <div class="card">
        <img src="qr.svg" alt="QR code">
        <div>Scan to control your player</div>
        <code id="joinUrl"></code>
      </div>
    </div>
  </div>

  <div id="modal"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
</body>
</html>
