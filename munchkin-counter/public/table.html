<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Munchkin Counter</title>
  <script>
    // The dashboard is for tablets and TVs; phones get their own controls.
    // Phone = a phone browser, or a screen under 600px on its short side (tablets start around 740px).
    // Inline and first, so a phone never renders the dashboard.
    (function () {
      var phoneBrowser = /iPhone|iPod|Android.+Mobile|Windows Phone|Mobi/i.test(navigator.userAgent);
      if (phoneBrowser || Math.min(screen.width, screen.height) < 600) location.replace('join');
    })();
  </script>
  <link rel="icon" href="logo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <meta name="theme-color" content="#1b120b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Munchkin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/table.css">
  <script type="module" src="js/table/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="logo" alt="">Munchkin</div>
    <a class="game-button" href="./" title="All games">🎲 <span id="gameName"></span></a>
    <div class="announcer" id="announcer" aria-live="polite"></div>
    <button class="bar-button primary" id="addPlayer">+ Player</button>
    <button class="bar-button icon" id="sound" title="Sound on/off">🔊</button>
    <button class="bar-button icon fullscreen-button" id="fullscreen" title="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="expand" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="collapse" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
    <img class="qr-thumb" id="qrButton" src="qr.svg" alt="Join QR code" title="Show join QR code">
  </header>

  <main id="board"></main>

  <div id="qrOverlay">
    <div class="card">
      <img src="qr.svg" alt="QR code">
      <div>Scan to control your player</div>
      <code id="joinUrl"></code>
    </div>
  </div>

  <div id="modal"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
</body>
</html>
