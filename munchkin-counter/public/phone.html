<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>My Munchkin</title>
  <link rel="icon" href="logo">
  <!-- PNG icons too: "Add to Home Screen" ignores SVG icons and would show a plain letter instead -->
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <meta name="theme-color" content="#1b120b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Munchkin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/phone.css">
  <script type="module" src="js/phone/main.js"></script>
</head>
<body>
  <section id="pickView" hidden>
    <h2>Who are you?</h2>
    <div class="player-list" id="playerList"></div>
    <form class="join" id="joinForm">
      <div class="label">New player</div>
      <div class="join-row">
        <input id="newName" placeholder="Your name" maxlength="20" autocomplete="off" aria-label="Your name">
        <div id="newSex"></div>
      </div>
      <button type="submit" class="join-button">Join the game</button>
    </form>
  </section>

  <section id="playView" hidden>
    <div class="me">
      <button class="avatar-button" id="avatarButton" aria-label="Change avatar"></button>
      <div class="who">
        <div class="name" id="playerName"></div>
        <button class="sex-icon" id="sexButton" aria-label="Change sex"></button>
      </div>
      <div class="strength"><b id="strength"></b><span>Strength</span></div>
    </div>
    <div class="avatar-grid" id="avatarGrid" hidden></div>

    <div class="panel" id="levelPanel">
      <div class="label" id="levelLabel">Level</div>
      <div class="controls">
        <button class="pm minus" id="levelDown" data-action="changeLevel" data-delta="-1" aria-label="Level down"></button>
        <span class="value" id="level"></span>
        <button class="pm plus" id="levelUp" data-action="changeLevel" data-delta="1" aria-label="Level up"></button>
      </div>
    </div>
    <div class="panel">
      <div class="label">Gear</div>
      <div class="controls">
        <button class="pm minus" data-action="changeGear" data-delta="-1" aria-label="Gear down"></button>
        <span class="value" id="gear"></span>
        <button class="pm plus" data-action="changeGear" data-delta="1" aria-label="Gear up"></button>
      </div>
    </div>

    <div class="bottom-row">
      <button class="died-button" id="died">💀 I died</button>
      <button class="report-button" id="report" title="How the game went" aria-label="How the game went">📈</button>
    </div>
    <button class="switch" id="switchPlayer">Switch player</button>
  </section>

  <div id="modal"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
</body>
</html>
