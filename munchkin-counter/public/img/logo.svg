<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Munchkin Counter">
  <title>Munchkin Counter</title>
  <!-- An original die logo: tilted ivory die with a playful M wearing a little horned helmet. -->
  <g transform="rotate(-9 32 32)">
    <!-- die: shadow side, face, shine -->
    <rect x="8" y="10" width="48" height="48" rx="11" fill="#7a1a12"/>
    <rect x="6" y="6" width="48" height="48" rx="11" fill="#f3e3bf" stroke="#2a1c12" stroke-width="3"/>
    <rect x="10" y="9" width="40" height="6" rx="3" fill="#fff8e6" opacity=".7"/>

    <!-- playful M: bouncy uneven legs, rounded tops and feet, a little shine -->
    <path d="M13.5 50 Q12.5 35 14.5 21.5 Q18.5 19 23 21 L30 33 L37.5 19.5 Q42.5 18 46.5 20.5
             Q47.5 36 46 49 Q42 50.5 38 49.5 L37.5 35 L30.5 45.5 L22.5 36 L22.5 50 Q18 51.5 13.5 50 Z"
          fill="#b3261e" stroke="#2a1c12" stroke-width="3" stroke-linejoin="round"/>
    <path d="M17.2 27 Q16.6 32 17 37" fill="none" stroke="#e8675a" stroke-width="2" stroke-linecap="round"/>
    <path d="M42.4 24.5 Q43.2 29 42.9 33" fill="none" stroke="#e8675a" stroke-width="2" stroke-linecap="round"/>

    <!-- little horned helmet, perched on the M's top-left corner at a jaunty angle -->
    <g transform="translate(19.5 19) rotate(-18) scale(0.8) translate(-30 -18)" stroke="#2a1c12" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M21.5 17.5 C17.5 16 15.5 12 16.5 7.5 C18.5 11 21 13 24 14" fill="#c9a26b"/>
      <path d="M38.5 17.5 C42.5 16 44.5 12 43.5 7.5 C41.5 11 39 13 36 14" fill="#c9a26b"/>
      <path d="M22 20 C22 14 25.5 11.5 30 11.5 C34.5 11.5 38 14 38 20 Z" fill="#9aa3a8"/>
      <rect x="20" y="18.5" width="20" height="4.5" rx="2.25" fill="#e8b54a"/>
      <path d="M25 15.5 C26.3 13.9 28 13.3 29.4 13.2" fill="none" stroke="#dfe5e8" stroke-width="1.5"/>
    </g>

  </g>
</svg>
