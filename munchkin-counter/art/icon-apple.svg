<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 180 180" width="180" height="180">
  <!-- iPhone / iPad home-screen icon (rendered to ../public/img/icon-180.png, see render.sh).
       iOS fills see-through parts with white and rounds the corners itself, so the icon has its own background. -->
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".72">
      <stop offset=".35" stop-color="#fff3c4" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a1d08" stop-opacity=".6"/>
    </radialGradient>
  </defs>
  <!-- gold comic sunburst: every other ray lighter, a glow behind the die, darker edges -->
  <rect width="180" height="180" fill="#e8a93a"/>
  <path fill="#f5c75a" d="M90 90 L223.5 133.4 L203.6 172.5 Z M90 90 L172.5 203.6 L133.4 223.5 Z M90 90 L90.0 230.4 L46.6 223.5 Z M90 90 L7.5 203.6 L-23.6 172.5 Z M90 90 L-43.5 133.4 L-50.4 90.0 Z M90 90 L-43.5 46.6 L-23.6 7.5 Z M90 90 L7.5 -23.6 L46.6 -43.5 Z M90 90 L90.0 -50.4 L133.4 -43.5 Z M90 90 L172.5 -23.6 L203.6 7.5 Z M90 90 L223.5 46.6 L230.4 90.0 Z"/>
  <rect width="180" height="180" fill="url(#glow)"/>
  <image x="20" y="20" width="140" height="140" xlink:href="../public/img/logo.svg" href="../public/img/logo.svg"/>
</svg>
